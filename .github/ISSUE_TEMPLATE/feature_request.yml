name: Feature request
description: Suggest an improvement or new provider capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior or API.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Provider support
        - Identity and permissions
        - Install or teardown
        - Gardener behavior
        - Documentation
        - Validation and CI
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
