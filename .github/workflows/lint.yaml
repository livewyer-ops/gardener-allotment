name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install aqua
        uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.56.3
      - name: Install tools
        run: aqua install
      - name: Add aqua tools to PATH
        run: echo "$(aqua root-dir)/bin" >> "$GITHUB_PATH"
      - name: Validate
        run: task validate
      - name: Render compositions
        run: task validate-render
      - name: Build AWS bundle
        run: |
          cp deploy/config-aws.yaml.example deploy/config.yaml
          task build
      - name: Build GCP bundle
        run: |
          cp deploy/config-gcp.yaml.example deploy/config.yaml
          task build
