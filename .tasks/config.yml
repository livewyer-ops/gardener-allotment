version: '3'

silent: true

tasks:
  preflight-config:
    desc: Validate deploy/config.yaml and provider files
    cmds:
      - |
        set -euo pipefail
        die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
        config_file="${ALLOTMENT_CONFIG_FILE:-deploy/config.yaml}"
        [ -f "$config_file" ] || die "$config_file not found."
        command -v cue >/dev/null 2>&1 \
          || die "cue not found. Run aqua install and add \$(aqua root-dir)/bin to PATH."
        cue vet -c schemas/allotment-config.cue yaml: "$config_file" -d '#AllotmentConfig'
        provider="$(cue export yaml: "$config_file" -e data.provider --out text)"

        [ -f "bootstrap/providers-${provider}.yaml" ] || die "bootstrap/providers-${provider}.yaml not found."
        [ -d "platform/compositions/${provider}" ] || die "platform/compositions/${provider}/ not found."
        [ -d "deploy/claims/${provider}" ] || die "deploy/claims/${provider}/ not found."

  preflight-install:
    desc: Validate install prerequisites
    cmds:
      - task: preflight-config
      - |
        set -euo pipefail
        die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
        require_command() {
          command -v "$1" >/dev/null 2>&1 || die "$1 not found. $2"
        }

        require_command kind "Run aqua install and add \$(aqua root-dir)/bin to PATH."
        require_command kubectl "Run aqua install and add \$(aqua root-dir)/bin to PATH."

        case "{{.PROVIDER}}" in
          aws)
            if [ ! -s private/aws-credentials ]; then
              require_command aws "Run aqua install and add \$(aqua root-dir)/bin to PATH, or run task bootstrap-identity first."
              AWS_PROFILE="{{.AWS_PROFILE}}" aws sts get-caller-identity >/dev/null \
                || die "AWS profile '{{.AWS_PROFILE}}' is not authenticated."
            fi
            ;;
          gcp)
            if [ ! -s private/gcp-credentials.json ] && [ -z "${GCP_CREDENTIALS_FILE:-}" ]; then
              die "private/gcp-credentials.json not found. Run task bootstrap-identity or set GCP_CREDENTIALS_FILE."
            fi
            if [ -n "${GCP_CREDENTIALS_FILE:-}" ] && [ ! -f "$GCP_CREDENTIALS_FILE" ]; then
              die "GCP_CREDENTIALS_FILE '$GCP_CREDENTIALS_FILE' not found."
            fi
            ;;
        esac

  preflight-env:
    desc: Check container runtime and cloud quota headroom for the configured footprint
    cmds:
      - |
        set -euo pipefail
        die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
        warn() { printf 'WARN: %s\n' "$*" >&2; }
        command -v yq >/dev/null 2>&1 || die "yq not found. Run aqua install and add \$(aqua root-dir)/bin to PATH."
        yq_cfg() { yq -r "$1" deploy/config.yaml; }

        # Container runtime: Docker, or Podman via its Docker-compatible API.
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          echo "runtime: docker"
        elif command -v podman >/dev/null 2>&1 \
          && [ "$(podman info --format json 2>/dev/null | yq -p json -r '.host.remoteSocket.exists // false')" = "true" ]; then
          echo "runtime: podman (kind auto-detects it; set KIND_EXPERIMENTAL_PROVIDER=podman if Docker is also installed)"
        else
          die "No usable container runtime. Start Docker, or enable Podman's API socket (Linux: systemctl --user start podman.socket; macOS: podman machine start with >=8 GiB memory)."
        fi

        provider="$(yq_cfg '.data.provider // ""')"
        region="$(yq_cfg '.data.region // ""')"
        project="$(yq_cfg '.data.projectId // ""')"
        zone_count="$(yq_cfg '.data.zones | length')"
        create_shoot="$(yq_cfg '.data.createShoot // "false"')"

        if [ "$provider" = "gcp" ]; then
          command -v gcloud >/dev/null 2>&1 || { warn "gcloud not found; skipping GCP quota check."; exit 0; }
          nodes_per_zone="$(yq_cfg '.data.gcpNodesPerZone // "2"')"
          machine="$(grep -m1 'machineType:' platform/compositions/gcp/infra.yaml | awk '{print $2}')"
          vcpu="${machine##*-}"
          disk_gb="$(grep -m1 'diskSizeGb:' platform/compositions/gcp/infra.yaml | awk '{print $2}')"
          nodes=$(( nodes_per_zone * zone_count ))
          need_cpu=$(( nodes * vcpu ))
          need_disk=$(( nodes * disk_gb ))
          if [ "$create_shoot" = "true" ]; then
            # Default GCP shoot: one n1-standard-2 worker with a 50 GB disk.
            need_cpu=$(( need_cpu + 2 ))
            need_disk=$(( need_disk + 50 ))
          fi
          echo "footprint: ${nodes} x ${machine}; total ${need_cpu} vCPUs, ${need_disk} GB standard PD in ${region}"
          quotas_json="$(gcloud compute regions describe "$region" --project "$project" --format=json 2>/dev/null || true)"
          [ -n "$quotas_json" ] || { warn "could not read region quotas (is gcloud authenticated for ${project}?); skipping quota check."; exit 0; }
          for check in "CPUS ${need_cpu}" "DISKS_TOTAL_GB ${need_disk}"; do
            metric="${check%% *}"
            need="${check##* }"
            limit="$(printf '%s' "$quotas_json" | yq -p json -r ".quotas[] | select(.metric == \"$metric\") | .limit")"
            usage="$(printf '%s' "$quotas_json" | yq -p json -r ".quotas[] | select(.metric == \"$metric\") | .usage")"
            headroom="$(awk -v l="$limit" -v u="$usage" 'BEGIN{printf "%d", l-u}')"
            [ "$headroom" -ge "$need" ] \
              || die "insufficient ${metric} quota in ${region}: need ${need}, headroom ${headroom} (limit ${limit}, in use ${usage}). Request an increase: https://console.cloud.google.com/iam-admin/quotas?project=${project}"
            echo "quota ${metric}: need ${need}, headroom ${headroom} (limit ${limit})"
          done
        elif [ "$provider" = "aws" ]; then
          command -v aws >/dev/null 2>&1 || { warn "aws not found; skipping AWS quota check."; exit 0; }
          if [ -s private/aws-credentials ]; then
            export AWS_SHARED_CREDENTIALS_FILE="$PWD/private/aws-credentials"
            export AWS_PROFILE=default
          else
            export AWS_PROFILE="{{.AWS_PROFILE}}"
          fi
          nodes_per_zone="$(yq_cfg '.data.awsNodesPerZone // "2"')"
          nodes=$(( nodes_per_zone * zone_count ))
          need_cpu=$(( nodes * 4 ))
          if [ "$create_shoot" = "true" ]; then
            # Default AWS shoot: one m5.xlarge worker.
            need_cpu=$(( need_cpu + 4 ))
          fi
          echo "footprint: ${nodes} x m5.xlarge; total ${need_cpu} vCPUs in ${region}"
          limit="$(aws service-quotas get-service-quota --service-code ec2 \
            --quota-code L-1216C47A --region "$region" \
            --query 'Quota.Value' --output text 2>/dev/null || true)"
          if [ -z "$limit" ] || [ "$limit" = "None" ]; then
            warn "could not read the EC2 On-Demand Standard vCPU quota (service-quotas access); skipping."
            exit 0
          fi
          lim_int="$(awk -v v="$limit" 'BEGIN{printf "%d", v}')"
          if ! instance_types="$(aws ec2 describe-instances --region "$region" \
            --filters 'Name=instance-state-name,Values=pending,running' \
            --query 'Reservations[].Instances[?InstanceLifecycle!=`spot`].InstanceType' \
            --output text 2>/dev/null)"; then
            warn "could not read current EC2 instance usage; skipping AWS quota check."
            exit 0
          fi

          used_cpu=0
          type_counts="$(printf '%s\n' "$instance_types" | tr '\t ' '\n' | sed '/^$/d' | sort | uniq -c)"
          while read -r count instance_type; do
            [ -n "${instance_type:-}" ] || continue
            family="${instance_type%%.*}"
            case "$family" in
              a* | c* | d* | h* | i* | m* | r* | t* | z*) ;;
              *) continue ;;
            esac
            vcpus="$(aws ec2 describe-instance-types --region "$region" \
              --instance-types "$instance_type" \
              --query 'InstanceTypes[0].VCpuInfo.DefaultVCpus' --output text 2>/dev/null)" \
              || die "could not determine vCPU count for EC2 instance type ${instance_type}."
            case "$vcpus" in
              '' | None | *[!0-9]*) die "invalid vCPU count '$vcpus' for EC2 instance type ${instance_type}." ;;
            esac
            used_cpu=$(( used_cpu + count * vcpus ))
          done <<<"$type_counts"

          headroom=$(( lim_int - used_cpu ))
          [ "$headroom" -ge "$need_cpu" ] \
            || die "insufficient EC2 On-Demand Standard vCPU quota in ${region}: need ${need_cpu}, headroom ${headroom} (limit ${lim_int}, in use ${used_cpu})."
          echo "quota EC2 vCPUs: need ${need_cpu}, headroom ${headroom} (limit ${lim_int}, in use ${used_cpu})"
        fi
