version: '3'

silent: true

tasks:
  run:
    desc: Validate YAML, Taskfiles, and Kubernetes manifests
    cmds:
      - |
        set -euo pipefail
        die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
        tool() {
          command -v "$1" >/dev/null 2>&1 || die "$1 not found. Run aqua install and add \$(aqua root-dir)/bin to PATH."
          "$@"
        }

        tool yamllint --version >/dev/null
        tool yq --version >/dev/null
        tool jq --version >/dev/null
        tool shellcheck --version >/dev/null
        tool cue version >/dev/null
        tool kubeconform -v >/dev/null
        tool chainsaw version >/dev/null

        tool shellcheck .tasks/*.sh

        tool yamllint -c .yamllint.yaml bootstrap/ platform/ deploy/ tests/ .github/ .tasks/ Taskfile.yml aqua.yaml kind.yaml

        {
          find bootstrap platform deploy tests .github .tasks -type f \( -name '*.yaml' -o -name '*.yml' \) -print
          printf '%s\n' Taskfile.yml aqua.yaml kind.yaml
        } | sort | while IFS= read -r file; do
          tool yq e '.' "$file" >/dev/null
        done
        find . -maxdepth 2 \( -path './.git' -o -path './private' \) -prune -o -type f -name '*.json' -print | sort \
          | while IFS= read -r file; do
            tool jq empty "$file"
          done

        find tests/chainsaw -type f -name chainsaw-test.yaml -print | sort | while IFS= read -r file; do
          tool chainsaw lint test -f "$file"
        done

        tool task --list >/dev/null

        for provider in aws gcp; do
          tool cue vet -c schemas/allotment-config.cue yaml: \
            "deploy/config-${provider}.yaml.example" -d '#AllotmentConfig'
        done

        find . -path './.git' -prune -o -path './private' -prune -o \
          -type f -name '*.md' -print | sort | while IFS= read -r file; do
          links="$(grep -oE '\[[^]]+\]\([^)]+\)' "$file" || true)"
          [ -n "$links" ] || continue
          while IFS= read -r link; do
            target="${link##*(}"
            target="${target%)}"
            case "$target" in
              http://* | https://* | mailto:* | \#* | "") continue ;;
            esac
            target="${target%%#*}"
            [ -n "$target" ] || continue
            [ -e "$(dirname "$file")/$target" ] || die "broken Markdown link in $file: $target"
          done <<EOF
        $links
        EOF
        done

        tool kubeconform -ignore-missing-schemas -summary bootstrap/ platform/ deploy/ kind.yaml

  render:
    desc: Render provider compositions and compare expected resource inventories
    cmds:
      - |
        set -euo pipefail
        die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
        tool() {
          command -v "$1" >/dev/null 2>&1 || die "$1 not found. Run aqua install and add \$(aqua root-dir)/bin to PATH."
          "$@"
        }

        # Container runtime: Docker, or Podman through its Docker-compatible
        # API socket (no docker symlink needed - the render tooling speaks the
        # API via DOCKER_HOST, not the docker binary).
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          :
        elif command -v podman >/dev/null 2>&1; then
          if [ -z "${DOCKER_HOST:-}" ]; then
            sock="$(podman info --format json 2>/dev/null | tool yq -p json -r '.host.remoteSocket.path // ""')"
            case "$sock" in
              unix://*) export DOCKER_HOST="$sock" ;;
              /*) export DOCKER_HOST="unix://$sock" ;;
            esac
          fi
          sock_up="$(podman info --format json 2>/dev/null | tool yq -p json -r '.host.remoteSocket.exists // false')"
          [ "$sock_up" = "true" ] \
            || die "podman found but its API socket is not listening. Linux: systemctl --user start podman.socket; macOS: podman machine start (give the machine >=8 GiB memory)."
        else
          die "No container runtime found. Install Docker, or Podman with its API socket enabled."
        fi
        tool crossplane version --client >/dev/null

        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        template_file="$tmp/templates.tmpl"
        : >"$template_file"
        find platform/templates -type f -name '*.tmpl' -print | sort | while IFS= read -r file; do
          printf '\n{{/* Source: %s */}}\n' "$file" >>"$template_file"
          cat "$file" >>"$template_file"
          printf '\n' >>"$template_file"
        done

        tool yq 'select(.kind == "Function")' platform/functions.yaml >"$tmp/functions.yaml"

        prepare_provider() {
          provider="$1"
          mkdir -p "$tmp/$provider/required"
          cp "deploy/config-${provider}.yaml.example" "$tmp/$provider/required/allotment-config.yaml"
          tool yq -i '.data.createShoot = "true"' "$tmp/$provider/required/allotment-config.yaml"
          case "$provider" in
            aws)
              tool yq -i '.data.projectId = "999999999999" |
                .data.zones = ["eu-west-1a", "eu-west-1b", "eu-west-1c"]' \
                "$tmp/$provider/required/allotment-config.yaml"
              ;;
            gcp)
              tool yq -i '.data.projectId = "allotment-render" |
                .data.zones = ["europe-west1-b", "europe-west1-c", "europe-west1-d"]' \
                "$tmp/$provider/required/allotment-config.yaml"
              ;;
          esac
          cp platform/configs/*.yaml "$tmp/$provider/required/"
          cat >"$tmp/$provider/required/gardener-sa-key.yaml" <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: gardener-sa-key
          namespace: crossplane-system
        data:
          accessKeyID: QUtJQURVTU1Z
          secretAccessKey: U0VDUkVURE1NWQ==
          serviceaccount.json: e30=
        EOF
          cat >"$tmp/$provider/required/xinfra.yaml" <<'EOF'
        apiVersion: allotment.io/v1alpha1
        kind: XInfra
        metadata:
          name: garden-infra
        status:
          vpcId: vpc-1234567890abcdef0
        EOF
        }

        write_xr() {
          provider="$1"
          component="$2"
          kind="$3"
          name="$4"
          cat >"$tmp/$provider/${component}.yaml" <<EOF
        apiVersion: allotment.io/v1alpha1
        kind: ${kind}
        metadata:
          name: ${name}
        spec: {}
        EOF
        }

        patch_composition() {
          source="$1"
          target="$2"
          TEMPLATE="$(cat "$template_file")" tool yq \
            '(.spec.pipeline[] | select(.functionRef.name == "function-go-templating").input.source) = "Inline" |
             (.spec.pipeline[] | select(.functionRef.name == "function-go-templating").input.inline.template) = strenv(TEMPLATE) |
             del(.spec.pipeline[] | select(.functionRef.name == "function-go-templating").input.fileSystem) |
             .spec.pipeline = [.spec.pipeline[] | select(.functionRef.name != "function-sequencer")]' \
            "$source" >"$target"
        }

        patch_production_composition() {
          source="$1"
          target="$2"
          TEMPLATE="$(cat "$template_file")" tool yq \
            '(.spec.pipeline[] | select(.functionRef.name == "function-go-templating").input.source) = "Inline" |
             (.spec.pipeline[] | select(.functionRef.name == "function-go-templating").input.inline.template) = strenv(TEMPLATE) |
             del(.spec.pipeline[] | select(.functionRef.name == "function-go-templating").input.fileSystem)' \
            "$source" >"$target"
        }

        render_component() {
          provider="$1"
          component="$2"
          kind="$3"
          name="$4"
          composition="platform/compositions/${provider}/${component}.yaml"
          patched="$tmp/$provider/${component}-composition.yaml"
          render="$tmp/$provider/${component}-render.yaml"
          inventory="$tmp/$provider/${component}.inventory"
          xr="$tmp/$provider/${component}.yaml"

          if [ "$component" = "allotment" ]; then
            xr="deploy/claims/${provider}/allotment.yaml"
          else
            write_xr "$provider" "$component" "$kind" "$name"
          fi

          patch_composition "$composition" "$patched"
          tool crossplane composition render "$xr" "$patched" "$tmp/functions.yaml" \
            --required-resources "$tmp/$provider/required" \
            --include-full-xr \
            --timeout="${RENDER_TIMEOUT:-3m}" >"$render"

          XR_KIND="$kind" XR_NAME="$name" tool yq -r \
            'select(type == "!!map" and has("kind")) |
             select(.apiVersion != "allotment.io/v1alpha1" or .kind != strenv(XR_KIND) or .metadata.name != strenv(XR_NAME)) |
             [.apiVersion, .kind, (.metadata.name // "-")] | @tsv' "$render" \
            | sed '/^[[:space:]]*$/d' | sort >"$inventory"

          expected_inventory="$tmp/$provider/${component}.expected.inventory"
          awk -v component="$component" \
            'NF && $1 !~ /^#/ && $1 == component {print $2 "\t" $3 "\t" $4}' \
            "tests/render/expected/${provider}.tsv" | sort >"$expected_inventory"
          diff -u "$expected_inventory" "$inventory" \
            || die "rendered ${provider}/${component} inventory changed"

          if grep -Eq 'your-gcp-project-id|123456789012' "$render"; then
            die "rendered ${provider}/${component} retained example project/account placeholder"
          fi
          if [ "$provider" = "gcp" ] && grep -q 'REPLACE' "$render"; then
            die "rendered ${provider}/${component} retained REPLACE placeholder"
          fi
          if [ "$provider" = "aws" ] && [ "$component" != "infra" ] && grep -q 'REPLACE' "$render"; then
            die "rendered ${provider}/${component} retained unexpected REPLACE placeholder"
          fi
          if [ "$provider" = "gcp" ] && [ "$component" = "infra" ]; then
            expected_locations="$(tool yq -r '.data.zones[]' "$tmp/$provider/required/allotment-config.yaml" | sort | paste -sd ',' -)"
            actual_locations="$(tool yq -r 'select(.apiVersion == "container.gcp.upbound.io/v1beta2" and .kind == "Cluster") | .spec.forProvider.nodeLocations[]' "$render" | sort | paste -sd ',' -)"
            [ "$actual_locations" = "$expected_locations" ] \
              || die "rendered gcp/infra nodeLocations '$actual_locations' did not match config zones '$expected_locations'"
          fi
          if [ "$provider" = "aws" ] && [ "$component" = "infra" ]; then
            zone_count="$(tool yq -r '.data.zones | length' "$tmp/$provider/required/allotment-config.yaml")"
            nodes_per_zone="$(tool yq -r '.data.awsNodesPerZone // 2' "$tmp/$provider/required/allotment-config.yaml")"
            expected_nodes=$((zone_count * nodes_per_zone))
            actual_nodes="$(tool yq -r 'select(.apiVersion == "eks.aws.upbound.io/v1beta2" and .kind == "NodeGroup") | .spec.forProvider.scalingConfig.desiredSize' "$render")"
            [ "$actual_nodes" = "$expected_nodes" ] \
              || die "rendered aws/infra desired node count '$actual_nodes' did not equal zones × awsNodesPerZone '$expected_nodes'"
          fi

          echo "Rendered ${provider}/${component}"
        }

        validate_aws_infra_sequence() {
          composition="$tmp/aws/infra-production-composition.yaml"
          render="$tmp/aws/infra-production-render.yaml"
          names="$tmp/aws/infra-production.names"

          patch_production_composition platform/compositions/aws/infra.yaml "$composition"
          tool crossplane composition render "$tmp/aws/infra.yaml" "$composition" "$tmp/functions.yaml" \
            --required-resources "$tmp/aws/required" \
            --include-full-xr \
            --include-function-results \
            --timeout="${RENDER_TIMEOUT:-3m}" >"$render"

          tool yq -r 'select(type == "!!map" and has("kind")) |
            (.metadata.annotations."crossplane.io/composition-resource-name" // "") |
            select(. != "")' "$render" \
            | sort >"$names"

          for name in eks-cluster-role eks-cluster-policy eks-node-role \
            eks-node-policy eks-cni-policy eks-ecr-policy; do
            grep -Fx -- "$name" "$names" >/dev/null \
              || die "production aws/infra sequence omitted initial prerequisite: $name"
          done
          for name in eks-cluster oidc-provider helm-providerconfig-runtime \
            eniconfig-a eks-nodegroup pod-cidr-probe-a eks-ebs-csi dns-zone; do
            if grep -Fx -- "$name" "$names" >/dev/null; then
              die "production aws/infra sequence created $name before IAM prerequisites were ready"
            fi
          done

          tool yq -r 'select(.kind == "Result") | .message' "$render" \
            | grep -F 'Delaying creation of resource(s) matching "eks-cluster"' >/dev/null \
            || die "production aws/infra render did not report the EKS sequence gate"
          echo "Validated production aws/infra sequence"
        }

        for provider in aws gcp; do
          prepare_provider "$provider"
          render_component "$provider" allotment XAllotment garden
          render_component "$provider" infra XInfra garden-infra
          render_component "$provider" workload XWorkload garden-workload
          render_component "$provider" garden XGarden garden-core
          render_component "$provider" seed XSeed garden-seed
          render_component "$provider" virtual XVirtualGarden garden-virtual
        done
        validate_aws_infra_sequence
