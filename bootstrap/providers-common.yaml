# DeploymentRuntimeConfig granting cluster-admin to provider pods
# Needed so provider-kubernetes can read connection secrets for references
# and provider-helm can manage resources across namespaces
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-cluster-admin
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-cluster-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-cluster-admin
subjects:
  - kind: ServiceAccount
    name: provider-cluster-admin
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-helm
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-helm:v1.2.0
  runtimeConfigRef:
    name: provider-cluster-admin
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v1.2.1
  runtimeConfigRef:
    name: provider-cluster-admin
