# Garden Composition (GCP): creates the Garden CR on the runtime cluster
# Separate composition so the Garden can be deleted independently during
# teardown — the operator runs its full cleanup DAG while all dependencies
# (extensions, operator, secrets) in XWorkload remain alive.
#
# The composed manifests (Garden CR, Secrets, VAP guard, Extension CRs) live
# in platform/templates/garden.tmpl, shared with the AWS composition and
# branched on the `provider` key from the allotment-config EnvironmentConfig.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: garden-gcp
  labels:
    provider: gcp
spec:
  compositeTypeRef:
    apiVersion: allotment.io/v1alpha1
    kind: XGarden
  mode: Pipeline
  pipeline:
    - step: load-versions
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
          - type: Reference
            ref:
              name: allotment-versions
          - type: Reference
            ref:
              name: allotment-versions-gcp
          - type: Reference
            ref:
              name: allotment-config

    # Pull the bootstrap SA key so we can materialise the gcp-dns Secret
    # directly in this composition (so it outlives XVirtualGarden's teardown
    # and is available throughout Garden's deletion DAG + gardenlet drain).
    - step: fetch-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: Secret
              apiVersion: v1
              into: sa-key
              namespace: crossplane-system
              type: Reference
              ref:
                name: gardener-sa-key

    - step: create-garden
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: FileSystem
        fileSystem:
          dirPath: /templates

    - step: auto-ready
      functionRef:
        name: function-auto-ready
