# Infrastructure Composition: GKE cluster + private Cloud DNS zone
# DNS zone depends on GKE cluster (sequencer ensures ordering)
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: infra-gcp
  labels:
    provider: gcp
spec:
  compositeTypeRef:
    apiVersion: allotment.io/v1alpha1
    kind: XInfra
  mode: Pipeline
  pipeline:
  - step: load-versions
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: allotment-versions
        - type: Reference
          ref:
            name: allotment-versions-gcp
        - type: Reference
          ref:
            name: allotment-config
  # Deletion ordering only: this sequencer's creation-gating is inert (it
  # runs before the resources are rendered); its enableDeletionSequencing
  # generates the Usage chain that orders teardown.
  - step: sequence
    functionRef:
      name: function-sequencer
    input:
      apiVersion: sequencer.fn.crossplane.io/v1beta1
      kind: Input
      rules:
      - sequence:
        - gke-cluster
        - (helm-providerconfig-runtime|k8s-providerconfig-runtime)
        - dns-zone
        - cloud-router
      enableDeletionSequencing: true
      replayDeletion: true
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      patchSets:
      - name: gcp-resource-labels
        patches:
        - type: FromEnvironmentFieldPath
          fromFieldPath: clusterName
          toFieldPath: spec.forProvider.resourceLabels["allotment_cluster"]
        - type: FromEnvironmentFieldPath
          fromFieldPath: provider
          toFieldPath: spec.forProvider.resourceLabels["allotment_provider"]
        - type: FromEnvironmentFieldPath
          fromFieldPath: createdBy
          toFieldPath: spec.forProvider.resourceLabels["allotment_created_by"]
          policy:
            fromFieldPath: Optional
        - type: FromEnvironmentFieldPath
          fromFieldPath: expiresAt
          toFieldPath: spec.forProvider.resourceLabels["allotment_expires_at"]
          policy:
            fromFieldPath: Optional
      - name: gcp-labels
        patches:
        - type: FromEnvironmentFieldPath
          fromFieldPath: clusterName
          toFieldPath: spec.forProvider.labels["allotment_cluster"]
        - type: FromEnvironmentFieldPath
          fromFieldPath: provider
          toFieldPath: spec.forProvider.labels["allotment_provider"]
        - type: FromEnvironmentFieldPath
          fromFieldPath: createdBy
          toFieldPath: spec.forProvider.labels["allotment_created_by"]
          policy:
            fromFieldPath: Optional
        - type: FromEnvironmentFieldPath
          fromFieldPath: expiresAt
          toFieldPath: spec.forProvider.labels["allotment_expires_at"]
          policy:
            fromFieldPath: Optional
      resources:
      - name: gke-cluster
        readinessChecks:
        - type: NonEmpty
          fieldPath: status.atProvider.controlPlaneEndpointsConfig.dnsEndpointConfig.endpoint
        - type: NonEmpty
          fieldPath: status.atProvider.masterAuth.clusterCaCertificate
        base:
          apiVersion: container.gcp.upbound.io/v1beta2
          kind: Cluster
          spec:
            initProvider:
              # Create-time only: GKE reports these back as secondary range names,
              # so enforcing the raw CIDRs after create causes replacement drift.
              ipAllocationPolicy:
                clusterIpv4CidrBlock: 10.2.0.0/16
                servicesIpv4CidrBlock: 10.3.0.0/20
            forProvider:
              initialNodeCount: 3
              nodeLocations: []
              minMasterVersion: REPLACE
              nodeConfig:
                # e2-standard-8 (not -4): the colocated garden+seed runtime packs
                # ~24 vCPU of components; on -4 (6×4 vCPU) the per-zone istio
                # ingress gateways (1 vCPU each) intermittently fail to schedule,
                # leaving RuntimeComponentsHealthy stuck. -8 gives reliable headroom.
                machineType: e2-standard-8
                diskSizeGb: 100
                diskType: pd-standard
                oauthScopes:
                - https://www.googleapis.com/auth/cloud-platform
                workloadMetadataConfig:
                  mode: GKE_METADATA
              # Workload Identity required for Crossplane identity-based auth on GKE
              workloadIdentityConfig:
                workloadPool: REPLACE
              controlPlaneEndpointsConfig:
                dnsEndpointConfig:
                  allowExternalTraffic: true
                ipEndpointsConfig:
                  enabled: true
              loggingService: logging.googleapis.com/kubernetes
              monitoringService: monitoring.googleapis.com/kubernetes
              # Must be false for clean teardown
              deletionProtection: false
            providerConfigRef:
              name: default
        patches:
        - type: FromEnvironmentFieldPath
          fromFieldPath: projectId
          toFieldPath: spec.forProvider.project
        - type: FromEnvironmentFieldPath
          fromFieldPath: region
          toFieldPath: spec.forProvider.location
        - type: FromEnvironmentFieldPath
          fromFieldPath: clusterName
          toFieldPath: metadata.name
        - type: FromEnvironmentFieldPath
          fromFieldPath: gkeVersion
          toFieldPath: spec.forProvider.minMasterVersion
        - type: FromEnvironmentFieldPath
          fromFieldPath: gcpNodesPerZone
          toFieldPath: spec.forProvider.initialNodeCount
          policy:
            fromFieldPath: Optional
        - type: PatchSet
          patchSetName: gcp-resource-labels
        - type: CombineFromEnvironment
          combine:
            variables:
            - fromFieldPath: projectId
            strategy: string
            string:
              fmt: '%s.svc.id.goog'
          toFieldPath: spec.forProvider.workloadIdentityConfig.workloadPool
        - type: FromEnvironmentFieldPath
          fromFieldPath: zones
          toFieldPath: spec.forProvider.nodeLocations
      - name: helm-providerconfig-runtime
        readinessChecks:
        - type: None
        base:
          apiVersion: helm.crossplane.io/v1beta1
          kind: ProviderConfig
          metadata:
            name: runtime
          spec:
            credentials:
              source: Secret
              secretRef:
                name: runtime-connection
                namespace: crossplane-system
                key: kubeconfig
            identity:
              type: GoogleApplicationCredentials
              source: Secret
              secretRef:
                name: gcp-credentials
                namespace: crossplane-system
                key: credentials
      - name: k8s-providerconfig-runtime
        readinessChecks:
        - type: None
        base:
          apiVersion: kubernetes.crossplane.io/v1alpha1
          kind: ProviderConfig
          metadata:
            name: runtime
          spec:
            credentials:
              source: Secret
              secretRef:
                name: runtime-connection
                namespace: crossplane-system
                key: kubeconfig
            identity:
              type: GoogleApplicationCredentials
              source: Secret
              secretRef:
                name: gcp-credentials
                namespace: crossplane-system
                key: credentials
      # Private DNS zone — resolvable within the GKE VPC only, no domain ownership needed
      - name: dns-zone
        base:
          apiVersion: dns.gcp.upbound.io/v1beta2
          kind: ManagedZone
          spec:
            forProvider:
              description: Allotment Gardener DNS zone
              forceDestroy: true  # Allow deletion even with existing records
              visibility: private
              privateVisibilityConfig:
                networks:
                - networkUrl: REPLACE
            providerConfigRef:
              name: default
        patches:
        - type: FromEnvironmentFieldPath
          fromFieldPath: projectId
          toFieldPath: spec.forProvider.project
        - type: CombineFromEnvironment
          combine:
            variables:
            - fromFieldPath: clusterName
            strategy: string
            string:
              fmt: '%s-dns'
          toFieldPath: metadata.name
        - type: CombineFromEnvironment
          combine:
            variables:
            - fromFieldPath: dnsDomain
            strategy: string
            string:
              fmt: '%s.'
          toFieldPath: spec.forProvider.dnsName
        - type: CombineFromEnvironment
          combine:
            variables:
            - fromFieldPath: projectId
            - fromFieldPath: vpcNetwork
            strategy: string
            string:
              fmt: projects/%s/global/networks/%s
          toFieldPath: spec.forProvider.privateVisibilityConfig.networks[0].networkUrl
        - type: PatchSet
          patchSetName: gcp-labels
      # Cloud Router on default VPC — required for shoots to reuse the seed VPC
      - name: cloud-router
        base:
          apiVersion: compute.gcp.upbound.io/v1beta2
          kind: Router
          spec:
            forProvider:
              description: Allotment shoot cloud router
            providerConfigRef:
              name: default
        patches:
        - type: FromEnvironmentFieldPath
          fromFieldPath: projectId
          toFieldPath: spec.forProvider.project
        - type: FromEnvironmentFieldPath
          fromFieldPath: region
          toFieldPath: spec.forProvider.region
        - type: FromEnvironmentFieldPath
          fromFieldPath: vpcNetwork
          toFieldPath: spec.forProvider.network
        - type: CombineFromEnvironment
          combine:
            variables:
            - fromFieldPath: clusterName
            strategy: string
            string:
              fmt: '%s-cloud-router'
          toFieldPath: metadata.name
  - step: render-runtime-connection
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: FileSystem
      fileSystem:
        dirPath: /templates
  - step: auto-ready
    functionRef:
      name: function-auto-ready
