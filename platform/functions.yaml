apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.10.7
---
# Composition templates live as real files in platform/templates/, packaged
# into the allotment-templates ConfigMap by `task install` and mounted into
# the function pod below. Compositions reference them via source: FileSystem.
# All files share one template namespace: shared partials (_*.tmpl, define-
# only) are usable from every concern template, and each concern template
# guards its output on the composite kind.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-go-templating
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              volumeMounts:
                - name: templates
                  mountPath: /templates
                  readOnly: true
          volumes:
            - name: templates
              configMap:
                name: allotment-templates
---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.12.1
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: function-go-templating
---
