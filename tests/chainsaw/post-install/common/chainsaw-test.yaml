apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: allotment-post-install-common
spec:
  description: Validate the reconciled Allotment control plane and runtime Garden.
  timeouts:
    assert: 10m
  steps:
    - name: control-plane-ready
      try:
        - description: Root XAllotment is Ready.
          assert:
            resource:
              apiVersion: allotment.io/v1alpha1
              kind: XAllotment
              metadata:
                name: garden
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - description: Child XRs are Ready.
          assert:
            file: child-xrs-ready.yaml
        - description: Common providers are Healthy.
          assert:
            file: common-providers-ready.yaml

    - name: runtime-garden-ready
      try:
        - description: Runtime Garden has completed reconciliation.
          assert:
            cluster: runtime
            resource:
              apiVersion: operator.gardener.cloud/v1alpha1
              kind: Garden
              metadata:
                name: core
              status:
                lastOperation:
                  state: Succeeded
                (conditions[?type == 'VirtualGardenAPIServerAvailable']):
                  - status: "True"
                (conditions[?type == 'RuntimeComponentsHealthy']):
                  - status: "True"
                (conditions[?type == 'VirtualComponentsHealthy']):
                  - status: "True"
                (conditions[?type == 'ObservabilityComponentsHealthy']):
                  - status: "True"
        - description: Dashboard kubeconfig secret is present.
          assert:
            cluster: runtime
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gardener
                namespace: garden
              (data.kubeconfig != ''): true

    - name: fluent-teardown-guard-armed
      try:
        - description: Fluent teardown guard policy exists on the runtime cluster.
          assert:
            cluster: runtime
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicy
              metadata:
                name: allotment-fluent-teardown-guard
        - description: Fluent teardown guard binding denies writes once the permit is gone.
          assert:
            cluster: runtime
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: allotment-fluent-teardown-guard
              spec:
                paramRef:
                  parameterNotFoundAction: Deny
        - description: Fluent write permit is present while the landscape is running.
          assert:
            cluster: runtime
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: allotment-fluent-write-permit
                namespace: garden
